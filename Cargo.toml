[package]
name = "hace-uni-runtime"
version = "0.1.0"
edition = "2021"
description = "Universal Runtime Public Facade - delegates to rr-wasm-runtime"

[lib]
name = "hace_uni_runtime"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hace-uni-resolver = { path = "../resolver" }
rr-wasm-runtime = { path = "../../../rr/wasm/runtime" }
bincode = "1.3"
wasm-bindgen = "0.2"